[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.3.9"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
authors = ["playhard.pro <rex@playhard.pro>"]
homepage = "https://github.com/playhard-pro"
repository = "https://github.com/playhard-pro/net-tools"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
socket2 = { version = "0.6", features = ["all"] }
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Keep only line tables in debug builds. Full debug information makes the
# executables and incremental artifacts much larger and slows down linking,
# while line tables still give readable backtraces and breakpoint locations.
# Override temporarily with `--config 'profile.dev.debug="full"'` when a
# debugger needs to inspect variables.
[profile.dev]
debug = 1

[profile.release]
opt-level = 3
# Thin LTO with multiple codegen units lets the optimizer work in parallel, so
# local release builds finish quickly. The release workflow overrides these
# settings with fat LTO and a single codegen unit to keep the shipped binaries
# as small and fast as possible.
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
