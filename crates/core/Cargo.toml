[package]
name = "net-tools-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
socket2.workspace = true
time = { workspace = true, features = ["formatting", "macros", "local-offset"] }
toml.workspace = true
tracing.workspace = true
surge-ping = "0.9.1"
pnet_packet = "0.35.0"
if-addrs = "0.15.0"
hickory-resolver = "0.26.3"
hickory-proto = "0.26.3"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset"] }
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1"
url = "2"
riperf3 = { version = "0.8", default-features = false }

# TLS certificate inspection, revocation, HSTS, CT and CAA checks.
x509-parser = "0.18"
x509-cert = "0.2"
x509-ocsp = { version = "0.2", features = ["builder", "std"] }
pkix-revocation = { version = "0.3", features = ["ocsp", "crl"] }
pkix-path = "0.3"
der = "0.7"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
sct = "0.7"
ct-logs = "0.9"
base64 = "0.22"
percent-encoding = "2"

# Timestamp and IANA timezone conversion for the Utils tab.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"

[dev-dependencies]
rcgen = "0.14"

[target.'cfg(windows)'.dependencies]
# Used by the ICMPv6 engine to read the reply hop limit via WSARecvMsg, which
# socket2 and tokio do not expose.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
