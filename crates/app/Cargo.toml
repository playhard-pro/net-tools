[package]
name = "net-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
net-tools-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
time.workspace = true
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "wgpu_no_default_features", "x11"] }
egui_extras = "0.36.2"
egui_plot = "0.37.0"
rfd = "0.17.2"
clap = "4.6.7"
dirs = "7.0.0"
rust-i18n = "4.2.4"
fontdb = "0.24.0"

# Use one rendering stack on every desktop platform. Compile only the native
# backend each target needs instead of pulling in every wgpu backend.
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }
egui-wgpu = { version = "0.36", default-features = false, features = ["macos-window-resize-jitter-fix"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Vulkan is the primary backend; GLES keeps the application usable when no
# Vulkan adapter is present.
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles"] }

[build-dependencies]
# Embeds the application icon into the Windows executable (see build.rs).
winresource = "0.1"
