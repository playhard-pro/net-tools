# cargo-deny configuration for net-tools.
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check every platform's dependencies, since net-tools is cross-platform.
targets = []
all-features = true

[advisories]
# Advisory database (RustSec) is fetched from the default URL.
# Add IDs here (with a reason) if an advisory must be temporarily ignored.
ignore = [
    # The zbus 5 split crates are unmaintained; the functionality moved into
    # zbus 6. They are pulled in transitively by the Linux accessibility stack
    # (accesskit/atspi) and there is no safe upgrade yet. These are maintenance
    # notices, not known vulnerabilities; remove once accesskit ships a zbus 6
    # based release.
    { id = "RUSTSEC-2026-0370", reason = "zvariant is only used by the Linux accessibility stack; no fixed release is available yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is only used by the Linux accessibility stack; no fixed release is available yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is only used by the Linux accessibility stack; no fixed release is available yet" },
    # riperf3 depends on the rsa crate for its optional authenticated mode. This
    # application never enables iperf3 authentication, so no RSA operation runs.
    { id = "RUSTSEC-2023-0071", reason = "rsa is an unused transitive dependency of riperf3; iperf3 authentication is not enabled" },
    # The chrono ecosystem is unmaintained, but no alternative release exists for
    # the crate itself. It is only used for timestamp conversion and the DNS
    # health timestamp; a migration to jiff is tracked separately.
    { id = "RUSTSEC-2026-0543", reason = "chrono is only used for timestamp and timezone formatting; no patched release exists" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is only used for IANA timezone names; no patched release exists" },
]

[licenses]
# Licenses accepted for all crates. Keep this list explicit and minimal.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Warn (do not fail) on duplicate crate versions.
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are referenced by path only and are never
# published, so their path dependencies are allowed to omit a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
