name: Promote Release

# Promote a tested pre-release created by the Release workflow. The existing
# release and its assets are reused, so what the maintainer tested is exactly
# what users receive. Only the pre-release flag and the latest-release pointer
# are changed.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tested release tag to promote (for example v0.3.7)'
        required: true
        type: string
  # Pushing release.toml with `channel = "stable"` promotes the version in the
  # workspace manifest. Pushes that keep the testing channel are skipped by the
  # channel check below, so resetting the file never touches a release.
  push:
    branches: [main]
    paths:
      - release.toml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify release channel
        id: channel
        run: |
          channel="$(bash scripts/release_channel.sh)"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          if [[ "$channel" != "stable" ]]; then
              echo "::notice::release.toml channel is '${channel}', no release to promote."
          fi

      - name: Promote GitHub Release
        if: steps.channel.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -o pipefail
          exec > >(tee promote.log) 2>&1

          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
              version="$(grep -m1 -E '^version[[:space:]]*=[[:space:]]*"[^"]+"' Cargo.toml \
                  | sed -E 's/^[^"]*"([^"]+)".*/\1/')"
              tag="v${version}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::invalid release tag: ${tag}"
              exit 1
          fi

          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          if ! grep -qx 'update.json' <<<"$assets"; then
              echo "::error::release ${tag} does not contain update.json"
              exit 1
          fi

          # This is the only state change: the same build becomes the latest
          # normal release, so `/releases/latest/download/update.json` starts
          # pointing at it. Keep the two updates separate: some gh versions
          # reject combining the prerelease and latest flags.
          gh release edit "$tag" --prerelease=false
          gh release edit "$tag" --latest

          echo "promoted ${tag} to the latest stable release"

      - name: Upload promote log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: promote-log
          path: promote.log
          if-no-files-found: ignore
