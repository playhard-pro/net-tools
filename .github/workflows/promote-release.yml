name: Promote Release

# Promote a tested pre-release created by the Release workflow. The existing
# release and its assets are reused, so what the maintainer tested is exactly
# what users receive. Only the pre-release flag and the latest-release pointer
# are changed.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tested release tag to promote (for example v0.3.7)'
        required: true
        type: string
  # Pushing release.toml with `channel = "stable"` promotes the version in the
  # workspace manifest. Pushes that keep the testing channel are skipped by the
  # channel check below, so resetting the file never touches a release.
  push:
    branches: [main]
    paths:
      - release.toml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify release channel
        id: channel
        run: |
          channel="$(bash scripts/release_channel.sh)"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          if [[ "$channel" != "stable" ]]; then
              echo "::notice::release.toml channel is '${channel}', no release to promote."
          fi

      - name: Promote GitHub Release
        if: steps.channel.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          exec > >(tee promote.log) 2>&1

          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
              version="$(grep -m1 -E '^version[[:space:]]*=[[:space:]]*"[^"]+"' Cargo.toml \
                  | sed -E 's/^[^"]*"([^"]+)".*/\1/')"
              tag="v${version}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::invalid release tag: ${tag}"
              exit 1
          fi

          api_path="repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          echo "promoting ${tag}"
          release_id="$(gh api "$api_path" --jq '.id')"
          has_manifest="$(gh api "$api_path" \
              --jq '[.assets[].name] | index("update.json") != null')"
          if [[ "$has_manifest" != "true" ]]; then
              echo "::error::release ${tag} does not contain update.json"
              exit 1
          fi

          # Editing a draft release through the API both publishes it and sets
          # the latest pointer in one request. This avoids relying on separate
          # `gh release edit` operations, which can race with GitHub's release
          # publication state.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false \
              -F prerelease=false \
              -F make_latest=true > /dev/null

          echo "promoted ${tag} to the latest stable release"

      - name: Upload promote log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: promote-log
          path: promote.log
          if-no-files-found: ignore
