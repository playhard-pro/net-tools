name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            formats: deb,appimage
            apt_packages: patchelf squashfs-tools file
          - os: windows-latest
            formats: wix,nsis
          - os: macos-latest
            formats: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build release binary
        run: cargo build --release --workspace

      - name: Package installers
        run: cargo packager -c packager.toml -f ${{ matrix.formats }}

      # cargo-packager always appends the WiX language identifier to the MSI
      # filename (e.g. `_en-US`) and offers no option to omit it, so strip it
      # before publishing. Only the MSI files are affected.
      - name: Strip WiX language suffix from MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Filter '*_en-US.msi' | ForEach-Object {
            $target = $_.Name -replace '_en-US', ''
            Rename-Item -LiteralPath $_.FullName -NewName $target
          }

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
