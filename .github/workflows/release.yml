name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Build and package on native runners only. Cross-compilation is avoided
  # because cargo-packager resolves the bundled binaries from `target/release`,
  # which only exists for a host (non `--target`) build.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            formats: deb,appimage
            apt_packages: patchelf squashfs-tools file
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            formats: deb,appimage
            apt_packages: patchelf squashfs-tools file
          - os: windows-latest
            platform: windows
            arch: x64
            windows_arch: x64
          - os: windows-11-arm
            platform: windows
            arch: arm64
            windows_arch: arm64
          - os: macos-15-arm64
            platform: macos
            arch: aarch64
            formats: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install cargo-packager
        if: runner.os != 'Windows'
        run: cargo install cargo-packager --locked

      - name: Build release binary
        run: cargo build --release --workspace

      - name: Package Linux / macOS installers
        if: runner.os != 'Windows'
        run: cargo packager -c packager.toml -f ${{ matrix.formats }}

      # Windows is distributed as a plain archive instead of an installer so
      # that the executable can still be started with administrator rights,
      # which the network probing features require.
      - name: Package Windows archive
        if: runner.os == 'Windows'
        run: pwsh scripts/package_windows.ps1 -Arch ${{ matrix.windows_arch }} -OutDir dist

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  # Single publishing job so that concurrent matrix jobs cannot race while
  # creating the GitHub Release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          merge-multiple: true
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
