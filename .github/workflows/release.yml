name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Build and package on native runners only. Cross-compilation is avoided
  # because cargo-packager resolves the bundled binaries from `target/release`,
  # which only exists for a host (non `--target`) build.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            formats: deb,appimage
            apt_packages: patchelf squashfs-tools file
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            formats: deb,appimage
            apt_packages: patchelf squashfs-tools file
          - os: windows-latest
            platform: windows
            arch: x64
            windows_arch: x64
          - os: windows-11-arm
            platform: windows
            arch: arm64
            windows_arch: arm64
          # The bare `macos-15` label points at the arm64 image. The
          # `macos-15-intel` label is the x86_64 image. Both builds run natively
          # because cargo-packager packages the host binary.
          - os: macos-15-intel
            platform: macos
            arch: x86_64
          - os: macos-15
            platform: macos
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install cargo-packager
        if: runner.os != 'Windows'
        run: cargo install cargo-packager --locked

      - name: Build release binary
        # Restore whole-program optimization for the artifacts users download.
        # Local builds use the faster thin LTO profile from the workspace
        # manifest, which is overridden here through Cargo's profile variables.
        env:
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: cargo build --release --workspace

      - name: Package Linux installers
        if: runner.os == 'Linux'
        run: cargo packager -c packager.toml -f ${{ matrix.formats }}

      # Signing and notarization are optional. When the secrets are absent the
      # script falls back to an ad-hoc signature so Gatekeeper does not report a
      # broken bundle. Empty secrets are ignored by the script.
      - name: Package macOS app and dmg
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
        run: bash scripts/package_macos.sh

      # cargo-packager omits the target OS from its file names, so add it here
      # to match the Windows archive naming scheme.
      - name: Add platform identifier to package names
        if: runner.os != 'Windows'
        run: bash scripts/rename_artifacts.sh ${{ matrix.platform }}

      # Windows is distributed as a plain archive instead of an installer so
      # that the executable can still be started with administrator rights,
      # which the network probing features require.
      - name: Package Windows archive
        if: runner.os == 'Windows'
        run: pwsh scripts/package_windows.ps1 -Arch ${{ matrix.windows_arch }} -OutDir dist

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  # Single publishing job so that concurrent matrix jobs cannot race while
  # creating the GitHub Release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          merge-multiple: true
          path: artifacts

      # The tag must match the workspace version. Otherwise the manifest and
      # the binaries would advertise different versions.
      - name: Read release channel
        id: channel
        run: |
          channel="$(bash scripts/release_channel.sh)"
          version="$(grep -m1 -E '^version[[:space:]]*=[[:space:]]*"[^"]+"' Cargo.toml \
              | sed -E 's/^[^"]*"([^"]+)".*/\1/')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
              exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          if [[ "$channel" == "testing" ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      # The manifest is attached under the fixed name `update.json`, which is
      # what the in-app updater fetches from `/releases/latest/download/`.
      - name: Generate update manifest
        run: bash scripts/generate_update_manifest.sh "$GITHUB_REF_NAME" artifacts/update.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.make_latest }}
