name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Use explicit macOS labels so both Intel and Apple Silicon builds run.
        # `macos-latest` moves to newer images over time and may not cover both.
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests (core)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p net-tools-core 2>&1 | tee core-tests.log

      # Keep the test output as an artifact so platform-specific failures can
      # be diagnosed without re-running the job.
      - name: Upload core test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-tests-${{ matrix.os }}
          path: core-tests.log
          if-no-files-found: ignore

      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log

      - name: Publish Clippy diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo '### Clippy output'
            echo '```'
            tail -200 clippy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -iE 'error|warning|failed|cannot|mismatch|expected' clippy.log | head -50 | while IFS= read -r line; do
            echo "::error title=Clippy::$line"
          done
          exit 0

      - name: Check formatting
        run: cargo fmt --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      # Keep the generator version in sync with about.toml; the generated text
      # changes between cargo-about releases, which would fail the diff below.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.3

      - name: Verify THIRD_PARTY_LICENSES.md is up to date
        run: |
          cargo about generate about.md.hbs -o "$RUNNER_TEMP/third-party-licenses.md"
          if ! diff -u THIRD_PARTY_LICENSES.md "$RUNNER_TEMP/third-party-licenses.md"; then
            echo "::error::THIRD_PARTY_LICENSES.md is out of date. Regenerate it with:"
            echo "::error::  cargo about generate about.md.hbs -o THIRD_PARTY_LICENSES.md"
            exit 1
          fi
