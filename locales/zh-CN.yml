  explain_open_what: "当前主机无需 NAT 即可在公网直接访问。"
  explain_open_advice: "P2P 连接很容易建立，但主机直接暴露在入站流量中。请保持防火墙开启，只运行确实需要对外提供的服务。"
  explain_full_what: "NAT 对所有目标使用同一个映射，并且任何外部主机向该映射发送数据包都能到达内网主机。"
  explain_full_advice: "P2P 和打洞通常很可靠。由于过滤行为与端点无关，知道映射地址的任何人都可能访问该主机，请检查防火墙规则。"
  explain_restricted_what: "NAT 对所有目标使用同一个映射，但只接受内网主机曾主动联系过的地址发来的数据包。"
  explain_restricted_advice: "双方都先向对方发送数据后，大多数 P2P 和打洞场景可以工作；通常通过 STUN 协调握手即可。"
  explain_port_restricted_what: "NAT 使用同一个映射，但会同时按来源地址和端口过滤入站数据包。"
  explain_port_restricted_advice: "双方通过 STUN 协调后打洞通常可行；没有协调时入站流量会被丢弃。"
  explain_firewall_what: "主机看起来拥有公网地址，但入站 UDP 被过滤。"
  explain_firewall_advice: "这更像防火墙策略而不是 NAT 映射。可以放行所需端口或使用打洞；双方都主动发起流量时 P2P 仍可能工作。"
  explain_symmetric_what: "当目标地址或端口变化时，NAT 会分配不同的映射，并且只有被联系过的对端才能回包。"
  explain_symmetric_advice: "直接 P2P 较困难，端口预测也不可靠。建议使用 TURN 等中继、在路由器上启用限制更少的 NAT 模式，或确认是否存在 CGNAT。"
  explain_blocked_what: "没有收到 STUN 响应，UDP 可能被阻断，或服务器不可达。"
  explain_blocked_advice: "请检查防火墙、更换 STUN 服务器，或改用基于 TCP/TLS 的服务和中继，而不是依赖 UDP。"
  explain_unsupported_what: "服务器有响应，但没有提供本检测所需的备用端点或来源变更能力。"
