  explain_open_what: "Your endpoint is directly reachable on the public internet without NAT."
  explain_open_advice: "Peer-to-peer connections are easy, but the host is exposed to inbound traffic. Keep a firewall enabled and only run services you intend to expose."
  explain_full_what: "The NAT keeps one mapping for all destinations and accepts inbound packets from any source that sends to that mapping."
  explain_full_advice: "P2P and hole punching are usually reliable. Because filtering is endpoint-independent, anyone who learns the mapping can reach it; review firewall rules."
  explain_restricted_what: "The NAT keeps one mapping for all destinations but only accepts packets from addresses the host has contacted."
  explain_restricted_advice: "Most P2P and hole punching scenarios work once both sides send to each other; a STUN-coordinated handshake is normally enough."
  explain_port_restricted_what: "The NAT keeps one mapping but filters inbound packets by both source address and port."
  explain_port_restricted_advice: "Hole punching usually works when both peers coordinate through STUN. Without coordination, inbound traffic is dropped."
  explain_firewall_what: "The host appears to have a public address, but inbound UDP is filtered."
  explain_firewall_advice: "This is a firewall policy rather than a NAT mapping. Allow the required port or use hole punching; peer-to-peer may work when both sides initiate traffic."
  explain_symmetric_what: "The NAT assigns a different mapping when the destination address or port changes, and only the contacted peer can send back."
  explain_symmetric_advice: "Direct P2P is difficult and port prediction is unreliable. Use a relay such as TURN, enable a less restrictive NAT mode on the router, or verify whether CGNAT is involved."
  explain_blocked_what: "No STUN response arrived, so UDP appears to be blocked or the server is unreachable."
  explain_blocked_advice: "Check the firewall, try another STUN server, or use TCP/TLS-based services and relays instead of UDP."
  explain_unsupported_what: "The server answered but did not provide the alternate endpoint or source-change behavior needed by this procedure."
  explain_unsupported_advice: "Try another STUN server. Some public servers only support basic binding and cannot classify NAT behavior."
  explain_unknown_what: "The discovery could not complete enough tests to classify the NAT."
  explain_unknown_advice: "Retry, increase the timeout, or try another server. Check the step log to see which request failed."


